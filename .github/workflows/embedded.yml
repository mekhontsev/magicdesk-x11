name: Embedded X11

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: bison patch mingw-w64-ucrt-x86_64-gcc
      - name: Host native tools
        shell: msys2 {0}
        run: |
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
          cygpath -w /usr/bin >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build library and example
        shell: pwsh
        run: .\gradlew.bat -p examples/android :embedded:assembleRelease :app:assembleDebug :app:lintDebug :embedded:lintDebug
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison ninja-build patch
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Corresponding source
        run: |
          git ls-files --recurse-submodules -z | tar --null --verbatim-files-from --files-from=- -czf "$RUNNER_TEMP/MagicDesk-X11-source.tar.gz"
      - name: Build and lint
        run: ./gradlew -p examples/android :embedded:assembleRelease :app:assembleDebug :app:lintDebug :embedded:lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: MagicDesk-X11-${{ github.sha }}
          path: |
            embedded/build/outputs/aar/embedded-release.aar
            examples/android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/MagicDesk-X11-source.tar.gz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-reports
          path: |
            embedded/build/reports/lint-results-debug.*
            examples/android/app/build/reports/lint-results-debug.*
