plugins {
    id 'com.android.library'
}

def termux = System.getenv('PREFIX')?.startsWith('/data/data/') && file("${System.getenv('PREFIX')}/bin/clang").isFile()
def nativeDirectory = layout.buildDirectory.dir('native').get().asFile
def jniDirectory = layout.buildDirectory.dir('jniLibs').get().asFile
def serverSources = layout.buildDirectory.dir('serverSources').get().asFile
def collectServerSources = tasks.register('collectServerSources', Sync) {
    from('../lorie/src/main/java') { include 'com/termux/x11/CmdEntryPoint.java', 'com/termux/x11/X11FileExchange.java' }
    into serverSources
}
def licenseAssets = layout.buildDirectory.dir('licenseAssets').get().asFile
def collectLicenses = tasks.register('collectLicenses', Sync) {
    from('..') { include 'LICENSE' }
    from('../lorie/src/main/cpp') { include '**/COPYING*', '**/LICENSE*' }
    into new File(licenseAssets, 'licenses/magicdesk-x11')
}

android {
    namespace 'com.termux.x11'
    compileSdk 37
    ndkVersion '27.3.13750724'
    defaultConfig {
        minSdk 34
        if (termux) ndk { abiFilters 'arm64-v8a' }
        else {
            ndk { abiFilters 'arm64-v8a', 'x86_64' }
            externalNativeBuild { cmake { targets 'Xlorie' } }
        }
        buildConfigField 'String', 'APPLICATION_ID', '"com.termux.x11"'
        buildConfigField 'String', 'COMMIT', '"embedded"'
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures { aidl true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            java.srcDirs 'src/main/java', serverSources
            assets.srcDir licenseAssets
            aidl.srcDir '../lorie/src/main/aidl'
            aidl.include 'com/termux/x11/ICmdEntryInterface.aidl'
        }
    }
    if (termux) sourceSets.main.jniLibs.srcDir jniDirectory
    else externalNativeBuild { cmake { path '../lorie/src/main/cpp/CMakeLists.txt' } }
}
tasks.named('preBuild').configure { dependsOn collectServerSources, collectLicenses }

if (termux) {
    def configureNative = tasks.register('configureNative', Exec) {
        inputs.files fileTree('../lorie/src/main/cpp') { include '**/*.cmake', 'CMakeLists.txt' }
        outputs.file new File(nativeDirectory, 'build.ninja')
        commandLine 'cmake', '-S', file('../lorie/src/main/cpp'), '-B', nativeDirectory,
                '-G', 'Ninja', '-DCMAKE_C_COMPILER=clang', '-DCMAKE_CXX_COMPILER=clang++',
                '-DCMAKE_ANDROID_ARCH_ABI=arm64-v8a', '-DCMAKE_POSITION_INDEPENDENT_CODE=ON',
                '-DCMAKE_C_FLAGS=-DANDROID -ffunction-sections -fdata-sections',
                '-DCMAKE_CXX_FLAGS=-DANDROID -ffunction-sections -fdata-sections',
                '-DLORIE_ANDROID_LIBDIR=/system/lib64',
                '-DCMAKE_SHARED_LINKER_FLAGS=-fno-termux-rpath -Wl,-z,max-page-size=16384 -Wl,--gc-sections'
    }
    def buildNative = tasks.register('buildNative', Exec) {
        dependsOn configureNative
        commandLine 'cmake', '--build', nativeDirectory, '--target', 'Xlorie', '-j', '4'
    }
    def packageNative = tasks.register('packageNative', Sync) {
        dependsOn buildNative
        from new File(nativeDirectory, 'libXlorie.so')
        into new File(jniDirectory, 'arm64-v8a')
    }
    tasks.named('preBuild').configure { dependsOn packageNative }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.3.0'
    compileOnly project(project.findProperty('x11StubProject') ?: ':shell-loader:stub')
}
